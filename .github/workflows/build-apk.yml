name: Build SQLMap Mobile APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        working-directory: sqlmap_app_structure
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SQLMap-Mobile-release-apk
          path: sqlmap_app_structure/build/outputs/apk/release/*.apk
          retention-days: 30